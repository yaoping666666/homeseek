<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeSeek · 可编辑原型</title>
<style>
/* 视觉样式：先在这里调整颜色、字体、圆角和间距。 */
/* 手机画布、底栏和视觉变量 */
:root {
  color-scheme: light;
  --frame: #ededeb;
  --canvas: #fbfaf8;
  --paper: #fbfaf8;
  --white: #ffffff;
  --ink: #171717;
  --muted: #7b7974;
  --line: #e7e5e2;
  --accent: #171717;
  --active: #eeebe6;
  --warm: #73433c;
  --warm-light: #f1eae7;
  --radius: 18px;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --display: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  --phone-width: 390px;
  --page-gutter: clamp(15px, 4.88vw, 19px);
  --nav-height: calc(72px + max(37px, env(safe-area-inset-bottom)));
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 320px; color: var(--ink); background: var(--frame); font: 14px/1.55 var(--font); }
button, input, textarea, select { font: inherit; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .52; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid #575651; outline-offset: 3px; }
img { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font: 750 24px/1.25 var(--display); letter-spacing: -.035em; overflow-wrap: anywhere; }
h2 { font-size: 21px; line-height: 1.35; }
h3 { font-size: 16px; line-height: 1.4; }
p + p { margin-top: 6px; }
.muted { color: var(--muted); }
small, .small { font-size: 13px; }
strong, .number { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }


.shell { position: relative; width: min(100%, var(--phone-width)); min-height: 100dvh; margin-inline: auto; background: var(--canvas); box-shadow: 0 0 0 1px #00000009, 0 10px 42px #0000000c; }
.top { height: 60px; display: flex; justify-content: flex-end; align-items: center; padding: 0 var(--page-gutter); }
.prototype-label { color: var(--muted); font-size: 10px; white-space: nowrap; }
#page { width: 100%; padding: 0 var(--page-gutter) calc(var(--nav-height) + 24px); }
#page:focus { outline: none; }
#page[data-view="find"] { padding-top: clamp(68px, 14.4dvh, 122px); }
#page[data-view="chat"], #page[data-view="listing"] { padding-top: 41px; }
.stack { display: grid; gap: 16px; }
.stack > * { min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

.mobile-nav { position: fixed; z-index: 4; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, var(--phone-width)); height: var(--nav-height); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0 var(--page-gutter) max(37px, env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--line); }
.nav-link { position: relative; display: grid; align-content: center; justify-items: center; gap: 6px; color: #92918d; font-size: 13px; line-height: 1.15; min-width: 0; padding-top: 8px; }
.nav-link[aria-current="page"] { color: var(--ink); font-weight: 610; }
.nav-link[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 16px; height: 1.5px; background: var(--ink); border-radius: 2px; }
.nav-link:hover { color: var(--ink); }
.nav-icon { position: relative; display: grid; place-items: center; width: 23px; height: 23px; }
.nav-icon--account { border-radius: 50%; overflow: hidden; background: #222; color: #fff; font-size: 12px; font-weight: 750; }
.nav-icon--account img { width: 100%; height: 100%; object-fit: cover; }
.page-heading { display: flex; justify-content: space-between; align-items: end; gap: 14px; }
.page-heading > div > p { margin-top: 9px; }
.page-heading > .btn { flex: 0 0 auto; }
.page-heading.compact h1 { font-size: clamp(23px, 6.1vw, 28px); }
.back { display: inline-flex; align-items: center; gap: 6px; width: fit-content; min-height: 34px; color: var(--ink); background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 650; }
.back:hover { text-decoration: underline; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.section-head p { margin-top: 6px; }
.rule { border: 0; margin: 0; border-top: 1px solid var(--line); }
.surface { border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
.pad { padding: 16px; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions.end { justify-content: flex-end; }
.btn { display: inline-flex; gap: 7px; justify-content: center; align-items: center; min-height: 43px; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; color: var(--ink); background: var(--white); font-weight: 650; font-size: 14px; line-height: 1.3; text-align: center; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: #303030; color: white; }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--warm); }
.text-link { border: 0; padding: 4px 0; width: fit-content; color: var(--accent); background: none; font-weight: 700; }
.text-link:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; width: fit-content; padding: 3px 8px; border-radius: 6px; background: var(--active); color: var(--ink); font-size: 12px; font-weight: 650; }
.chip.warm { background: var(--warm-light); color: var(--warm); }
.chip.neutral { background: var(--canvas); color: var(--muted); }
.pills, .tabbar { display: flex; gap: 7px; flex-wrap: wrap; }
.tabbar { padding: 4px 0; gap: 0; border-bottom: 1px solid var(--line); }
.tab { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 7px 15px; border: 0; border-bottom: 2px solid transparent; color: var(--muted); background: transparent; font-weight: 650; }
.tab[aria-current], .tab[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

label { display: grid; gap: 6px; font-weight: 650; }
label small { font-weight: 450; color: var(--muted); }
input:where(:not([type="checkbox"], [type="radio"], [type="file"])), textarea, select {
  width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--ink);
}
input[type="search"] { padding-left: 14px; }
textarea { min-height: 101px; resize: vertical; }
input[type="checkbox"] { accent-color: var(--accent); width: 17px; height: 17px; }
.upload { display: grid; align-content: center; gap: 6px; min-height: 112px; padding: 13px; border: 1px dashed #b6b3ae; border-radius: 10px; background: var(--canvas); overflow-wrap: anywhere; }
.upload input { width: 100%; font-size: 12px; font-weight: 450; }
.check, .radio { display: flex; gap: 9px; align-items: center; font-weight: 550; }
.searchbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.searchbar:has(> [data-action="history-menu"]) { grid-template-columns: minmax(0, 1fr) auto auto; }
.form-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 11px; }
.form-foot .actions { margin-left: auto; }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.field-grid .full { grid-column: 1 / -1; }
.foot-sticky { position: sticky; bottom: 0; z-index: 2; background: var(--white); border-top: 1px solid var(--line); }
.narrow { max-width: 720px; }
.empty { padding: 43px 17px; text-align: center; color: var(--muted); border: 1px dashed #d6d2cb; border-radius: var(--radius); background: var(--paper); }
.empty p + p { margin-top: 8px; }
.notice { padding: 11px 14px; color: var(--muted); background: var(--active); border-left: 3px solid #b6b1a9; border-radius: 0 8px 8px 0; font-size: 13px; }
.loading { display: flex; align-items: center; gap: 12px; }
.spinner { width: 18px; height: 18px; border: 2px solid #d1cec8; border-right-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.case-list, .item-list { display: grid; gap: 8px; }
.case-item, .list-link { display: flex; width: 100%; min-height: 57px; align-items: center; gap: 13px; justify-content: space-between; padding: 12px 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; text-align: left; }
.case-item:hover, .list-link:hover, .card-link:hover { border-color: #a6a39e; }
.case-item span, .list-link span { display: block; }
.step-arrow { color: var(--accent); margin-left: auto; padding-right: 3px; font-size: 21px; }
.note-card { position: relative; display: grid; align-content: start; overflow: hidden; min-width: 0; }
.card-link { display: block; height: 100%; border: 1px solid var(--line); }
.note-card .cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--active); }
.no-cover { display: grid; place-items: center; color: var(--muted); }
.note-card .note-meta, .record-card .record-body { padding: 15px; display: grid; gap: 8px; }
.note-meta > p { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.row-between { display: flex; gap: 12px; justify-content: space-between; align-items: start; }
.price { color: var(--accent); font-size: 19px; font-weight: 800; white-space: nowrap; }
.detail-price { font: 700 37px/1.2 var(--display); color: var(--accent); }
.gallery-lead { position: relative; width: 100%; border: 0; padding: 0; overflow: hidden; background: var(--active); border-radius: 10px; }
.gallery-lead img { width: 100%; max-height: 350px; aspect-ratio: 16/9; object-fit: cover; }
.thumbs { display: flex; gap: 8px; overflow: auto; padding: 3px; }
.thumb { display: grid; gap: 5px; text-align: center; background: var(--white); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 4px; flex: 0 0 96px; font-size: 12px; }
.thumb img { width: 100%; height: 62px; border-radius: 5px; object-fit: cover; }
.thumb[aria-pressed="true"] { border-color: var(--accent); background: var(--active); }
.data-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin: 0; }
.data-grid div { padding: 11px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.data-grid dt { color: var(--muted); font-size: 12px; }
.data-grid dd { font-weight: 700; margin: 4px 0 0; }
.record-card { display: flex; gap: 7px; align-items: start; padding-right: 10px; }
.record-card .record-body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.record-card .record-body:hover h3 { text-decoration: underline; }
.record-card .btn { margin-top: 11px; }
.record-card .select-row { margin: 16px 0 0 10px; }
.bubble { width: fit-content; max-width: 92%; justify-self: end; background: var(--accent); color: white; padding: 11px 14px; border-radius: 12px 12px 3px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { display: grid; gap: 9px; }
.reply p { white-space: pre-wrap; overflow-wrap: anywhere; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(87px,1fr)); gap: 8px; }
.metric { padding: 8px 10px; background: var(--canvas); border-radius: 8px; display: grid; gap: 2px; min-width: 0; }
.metric strong { font-size: 21px; }
.metric span { color: var(--muted); font-size: 12px; }
blockquote { margin: 0; padding: 12px 14px; background: var(--active); border-left: 3px solid #b6b1a9; border-radius: 0 8px 8px 0; overflow-wrap: anywhere; }
.property { display: grid; gap: 8px; padding: 16px; }
.property:hover { border-color: #a6a39e; }
.chart { position: relative; height: 195px; margin: 9px 16px 0 26px; border-left: 1px solid #aba8a2; border-bottom: 1px solid #aba8a2; }
.chart canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.chart-dot { position: absolute; transform: translate(-50%,50%); z-index: 1; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: none; background: transparent; }
.chart-dot::after { content: ""; border: 2px solid var(--white); width: 13px; height: 13px; border-radius: 50%; background: var(--accent); display: block; }
.chart-dot[aria-pressed="true"]::after { background: var(--warm); width: 17px; height: 17px; }
.chart-dates { margin-left: 25px; display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
.avatar { display: grid; place-items: center; max-width: 100%; width: 64px; aspect-ratio: 1; border-radius: 50%; background: var(--active); color: var(--accent); font-size: 26px; font-weight: 700; overflow: hidden; flex: 0 0 auto; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.account-header { display: flex; align-items: center; gap: 13px; }
.account-header h1 { overflow-wrap: anywhere; }
.plan-card { padding: 17px; display: flex; flex-direction: column; gap: 11px; }
.plan-card .btn { margin-top: auto; }
.plan-card ul { padding-left: 1.2em; margin: 0 0 11px; }
.compare { overflow-x: auto; }
.compare table { width: 100%; min-width: 455px; border-collapse: collapse; }
.compare td, .compare th { text-align: left; padding: 9px; border-bottom: 1px solid var(--line); }
.points-row { padding: 10px 0; display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); }
.preview { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 100px; border: 1px solid var(--line); padding: 11px; border-radius: 8px; background: var(--white); }
.photo-field { display: grid; gap: 7px; }
.photo-field img { width: 100%; height: 112px; object-fit: cover; border-radius: 7px; }
dialog { position: fixed; inset: auto auto 0 50%; transform: translateX(-50%); padding: 0; margin: 0; max-height: min(86dvh, 790px); width: min(100%, var(--phone-width)); max-width: none; border: 1px solid var(--line); border-bottom: 0; border-radius: 21px 21px 0 0; background: var(--paper); color: var(--ink); box-shadow: 0 16px 66px #0004; }
dialog::backdrop { background: #1115; }
.dialog-title { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; gap: 12px; align-items: center; background: var(--paper); padding: 21px 17px 10px; border-bottom: 1px solid var(--line); }
.dialog-title::before { content: ""; position: absolute; top: 9px; left: calc(50% - 17px); width: 34px; height: 4px; border-radius: 3px; background: #d7d4ce; }
.dialog-title .btn { min-height: 36px; padding: 6px 13px; }
.dialog-body { padding: 14px 17px max(18px, env(safe-area-inset-bottom)); }
.dialog-body fieldset { min-width: 0; margin: 0; padding: 3px 0 7px; border: 0; border-bottom: 1px solid var(--line); }
.dialog-body legend { font-weight: 680; font-size: 13px; color: var(--muted); padding: 0; }
.dialog-photo { width: 100%; max-height: 65dvh; object-fit: contain; background: #151515; }
dialog.wide { inset: 0 auto 0 50%; max-height: none; height: 100dvh; border: 0; border-radius: 0; background: #151515; color: var(--white); }
dialog.wide .dialog-title { background: #151515; color: var(--white); border-color: #414141; }
dialog.wide .dialog-title::before { display: none; }
dialog.wide .btn { color: #f5f5f5; border-color: #555; background: #242424; }
dialog.wide .btn:hover:not(:disabled) { color: white; border-color: #aaa; }
dialog.wide .dialog-body { padding-top: min(11dvh, 88px); }
#toast { position: fixed; z-index: 9; left: 50%; bottom: calc(var(--nav-height) + 10px); transform: translateX(-50%); max-width: min(calc(100% - 28px), 420px); padding: 10px 14px; background: var(--ink); color: white; border-radius: 8px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .16s ease; }
#toast.visible { opacity: 1; }
noscript { display: block; padding: 20px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* 找房首页与模式菜单 */
.find-home { display: grid; gap: 0; }
.home-name { position: relative; top: 2px; transform: scaleX(1.042); transform-origin: left; margin: 0 0 -3px 2px; font-size: clamp(44px, 14.3vw, 56px); font-weight: 900; line-height: .94; letter-spacing: -.058em; }
.search-composer { padding: 19px 12px 12px 18px; display: grid; gap: 10px; border-radius: 20px; box-shadow: 0 18px 36px #17171712; }
.composer-label { display: block; font-weight: 720; font-size: 14px; }
.search-composer:not(.poster) textarea { min-height: 55px; padding: 4px 3px; border: 0; resize: none; background: var(--white); }
.search-composer:not(.poster) textarea::placeholder { color: #81807c; }
.search-composer .composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.send-circle { border-radius: 50%; padding: 0; min-height: 34px; width: 34px; flex: 0 0 34px; font-size: 19px; line-height: 1; }
.mode-menu { position: relative; z-index: 3; }
.mode-menu summary { display: flex; align-items: center; gap: 8px; min-height: 33px; padding: 0 10px; width: fit-content; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; font-weight: 660; list-style: none; }
.mode-menu summary::-webkit-details-marker { display: none; }
.mode-options { position: absolute; top: calc(100% + 6px); left: 0; width: min(274px, calc(100vw - 62px)); display: grid; padding: 5px; border-radius: 14px; border: 1px solid var(--line); background: var(--white); box-shadow: 0 12px 28px #0002; }
.poster .mode-options { top: auto; bottom: calc(100% + 7px); }
.mode-options button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 0; border-radius: 9px; background: none; padding: 8px 10px; color: var(--ink); min-height: 49px; }
.mode-options button[aria-pressed="true"], .mode-options button:hover { background: var(--active); }
.mode-options small { display: block; color: var(--muted); margin-top: 2px; font-size: 12px; }
.reference-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.reference-grid .upload { min-width: 0; }
.inventory-count { margin: 15px 0 28px; padding-inline: 22px; font-size: 12px; color: var(--muted); }
.inventory-count strong { font-size: 15px; color: var(--ink); }
.inventory-count span { padding-inline: 5px; }
.case-entry { appearance: none; display: flex; width: 100%; justify-content: space-between; align-items: center; text-align: left; padding: 15px 1px; background: transparent; color: var(--ink); border: 0; border-block: 1px solid var(--line); }
.case-entry > span:first-child { display: grid; gap: 2px; }
.case-entry small { color: var(--muted); font-size: 11px; }
.case-entry strong { font-size: 15px; }
.case-arrow { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); font-size: 20px; }
.case-list { gap: 0; }
.case-item { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 12px 2px; }
.case-item:hover { background: var(--active); }

/* 笔记列表、图片和编辑页 */
.note-list { gap: 19px; }
.note-cover { position: relative; overflow: hidden; }
.note-card .cover { aspect-ratio: 2/1; }
.cover-tags { display: flex; flex-wrap: wrap; gap: 5px; position: absolute; top: 9px; left: 10px; }
.cover-tags .chip, .cover-count { border-radius: 999px; background: var(--white); color: var(--ink); font-size: 11px; padding: 4px 8px; font-weight: 680; }
.cover-count { position: absolute; right: 9px; bottom: 9px; }
.note-card .note-meta { padding: 19px 20px 14px; gap: 10px; }
.note-meta h3 { font-size: 17px; }
.note-meta .price { font-size: 16px; }
.note-specs { align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.note-author { margin-top: 3px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; align-items: center; gap: 9px; font-size: 12px; }
.note-author .avatar { width: 32px; font-size: 13px; }
.note-actions { gap: 6px; }
.note-actions .btn { flex: 1 1 auto; padding-inline: 8px; }
.gallery-panel { overflow: hidden; gap: 12px; padding-bottom: 13px; }
.gallery-panel .gallery-lead { border-radius: 0; }
.gallery-panel .gallery-lead img { aspect-ratio: 1.6; }
.gallery-heading, .gallery-panel .thumbs { margin-inline: 13px; }
.gallery-heading h2 { font-size: 16px; }
.gallery-panel .thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: visible; padding: 0; }
.gallery-panel .thumb { min-width: 0; }
.gallery-panel .thumb img { height: auto; aspect-ratio: 1.35; }
.gallery-panel .thumb span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.note-detail .data-grid { grid-template-columns: 1fr; }
.note-detail .data-grid div { background: var(--paper); }
.note-detail .data-grid dd { color: var(--ink); }
body:has(#page[data-view="note-edit"]) { overflow: hidden; }
.shell:has(#page[data-view="note-edit"]) { background: #d9d7d3; }
.shell:has(#page[data-view="note-edit"]) .mobile-nav { visibility: hidden; }
.editor-frame { position: fixed; z-index: 5; inset: clamp(38px, 11.34dvh, 96px) auto max(4.72dvh, env(safe-area-inset-bottom)) 50%; transform: translateX(-50%); width: min(calc(100% - 16px), calc(var(--phone-width) - 16px)); overflow: auto; overscroll-behavior: contain; background: var(--paper); border: 1px solid var(--line); border-radius: 21px; box-shadow: 0 12px 36px #0001; gap: 0; }
.editor-header { position: sticky; top: 0; z-index: 3; padding: 18px 20px 15px; background: var(--paper); border-bottom: 1px solid var(--line); }
.editor-header .page-heading { align-items: start; }

function readData() {

    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && Array.isArray(saved.notes) && Array.isArray(saved.chats) &&
        typeof saved.profile?.name === 'string' && Number.isFinite(saved.points)) return saved;
  } catch {

  return structuredClone(DEFAULT_DATA);
}

function store() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch {
    return false;
  }
}

let toastTimer;
function notify(message) {
  toastNode.textContent = message;
  toastNode.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastNode.classList.remove('visible'), 2700);
}

function saveNotice(message) {
  notify(store() ? message : '改动已应用到本次会话。浏览器无法继续保存本地数据。');
}

// 有的预览环境（如把本地文件当 data: 快照打开）改不了 location.hash，所以另存一份当前路径。
let currentPath = location.hash.slice(1);

function route() {
  return (currentPath || 'find').split('/');
}

function go(path) {
  if (dialog.open) dialog.close();
  if (currentPath === path) { render(); return; }
  const before = location.href;
  location.hash = path;
  if (location.href === before) {
    currentPath = path;
    onNavigate();
  }
}

// 图标与文字分开，页面里的标签、说明和按钮仍可逐项编辑。
function glyph(name) {
  return `<span class="glyph glyph--${name}" aria-hidden="true"></span>`;
}

function action(label, name, value = '', extra = '') {
  const icons = { filters: 'filters', 'share-note': 'share', 'share-chat': 'share', visibility: 'globe', 'delete-note': 'trash' };
  return `<button type="button" class="btn ${extra}" data-action="${name}" data-value="${esc(value)}">${icons[name] ? glyph(icons[name]) : ''}${esc(label)}</button>`;
}

function link(label, path, extra = '') {
  return `<a class="btn ${extra}" href="#${esc(path)}">${esc(label)}</a>`;
}

function back(label, path) {
  return `<a class="back" href="#${esc(path)}">${glyph('left')}${esc(label)}</a>`;
}

function chip(label, kind = '') {
  return `<span class="chip ${kind}">${esc(label)}</span>`;
}

function heading(title, description = '', control = '', compact = false) {
  return `<div class="page-heading ${compact ? 'compact' : ''}"><div><h1>${esc(title)}</h1>${description ? `<p class="muted">${esc(description)}</p>` : ''}</div>${control}</div>`;
}

function empty(message, next = '') {
  return `<div class="empty"><p>${esc(message)}</p>${next ? `<p>${next}</p>` : ''}</div>`;
}

function metrics(items) {
  return `<div class="metrics">${items.map(([label, value]) => `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('')}</div>`;
}

function gridFields(items) {
  return `<dl class="data-grid">${items.map(([label, value]) => `<div><dt>${esc(label)}</dt><dd>${esc(value || '待确认')}</dd></div>`).join('')}</dl>`;
}

function showDialog(title, content, wide = false, subtitle = '', panel = '') {
  dialog.classList.toggle('wide', wide);
  dialog.dataset.panel = panel;
  dialog.setAttribute('aria-label', title);
  dialog.innerHTML = `<header class="dialog-title"><div><h2>${esc(title)}</h2>${subtitle ? `<p class="muted">${esc(subtitle)}</p>` : ''}</div>
    <button type="button" class="btn dialog-close" aria-label="关闭" data-action="close">${glyph('x')}</button></header><div class="dialog-body">${content}</div>`;
  if (!dialog.open) dialog.showModal();
}

function modeLabel(mode) {
  return MODES[mode]?.name || MODES.find.name;
}

function byNote(id) { return data.notes.find(note => note.id === id); }
function byChat(id) { return data.chats.find(chat => chat.id === id); }
function byProperty(id) { return PROPERTIES.find(property => property.id === id); }
function lookup(list, value) { return list.find(item => item.name === value); }

function pageArea(path, args) {
  if (['account', 'profile', 'plans', 'orders', 'redeem', 'bind', 'history'].includes(path)) return 'account';
  if (['note', 'note-edit'].includes(path)) return args[1] === 'my-notes' || args[0] === 'new' ? 'my-notes' : 'notes';
  if (['chat', 'listing'].includes(path)) return args[2] === 'find' ? 'find' : 'account';
  return NAV.some(item => item.route === path) ? path : 'find';
}

function formField(label, name, value = '', attributes = '', type = 'text') {

function selectField(label, name, value, options) {

  if (note.price) return `${note.price}${note.unit || ''}`;
  const suffix = { 1: '万/月', 3: '万/3个月', 6: '万/半年', 12: '万/年' };
  const period = note.type === 'rent' && RENT_PERIODS.find(([months]) => note[`rent${months}`]);
  return period ? `${note[`rent${period[0]}`]}${suffix[period[0]]}` : '价格待确认';
}

function rentGroup(title, help, group, draft) {
  return `<div class="rent-group stack"><div><h3>${title}</h3><p class="small muted">${help}</p></div>
    <div class="field-grid">${RENT_PERIODS.map(([months, label, sample]) => `<label>${label}<span class="unit-input"><input name="${group}${months}" inputmode="decimal" maxlength="12" placeholder="${sample}" value="${esc(draft[`${group}${months}`])}"><span class="small muted">万</span></span></label>`).join('')}</div>
  </div>`;
}

function priceFields(draft) {
  if (draft.type === 'sale') {
    return `<div class="field-grid price-row">
      ${formField('售价', 'price', draft.price, 'maxlength="50" placeholder="总价 268；区间 268–288"')}
      ${selectField('单位', 'unit', draft.unit, [['万', '万'], ['元/月', '元/月'], ['元/年', '元/年']])}
    </div>`;
  }
  if (draft.type === 'rent') {
    return `<div class="rent-group stack"><div><h3>租赁业务</h3><p class="small muted">按实际出租方式选择，粘贴原文时会自动识别。</p></div>
        ${selectField('租赁业务类型', 'rentType', draft.rentType || '常规出租', [['常规出租', '常规出租'], ['春节短租', '春节短租'], ['常规出租 + 春节报价', '常规出租 + 春节报价']])}
      </div>
      ${rentGroup('常规租金', '统一按万元填写，不同周期独立保存，不进行换算。', 'rent', draft)}
      ${rentGroup('春节期间', '仅填写原文明确给出的春节报价，不与常规租金混用。', 'spring', draft)}`;
  }
  return '<p class="type-hint muted">先选择出售或出租，系统会显示对应的价格填写方式。</p>';
}

function typeLabel(type) { return type === 'rent' ? '出租' : '出售'; }
// 笔记的基本信息字段。「基本信息」用表格列出全部字段，「详细介绍」列出已填写的字段，两处读同一份数据。
function noteFields(note) {
  return [['楼盘', note.estate], ['类型', typeLabel(note.type)], ['租赁类型', ''], ['楼层', note.floor], ['面积', areaLabel(note.area)],
    ['价格', notePrice(note)], ['房型', note.layout], ['朝向', note.facing], ['设施', note.facilities], ['佣金', note.commission]];
}

// 笔记面积按数字保存，展示时补上单位；已经写了单位的原样显示。
function areaLabel(value) {
  const area = String(value ?? '').trim();
  return /\d$/.test(area) ? `${area}㎡` : area;
}
function visibilityLabel(value) { return value === 'public' ? '公开' : '仅自己'; }

function selectedNotes(group, filter = ui.filters[group]) {
  const mine = group === 'my-notes';

          <div class="note-author"><span class="avatar" aria-hidden="true">${avatarInitial(note.owner || data.profile.name)}</span><strong>${esc(note.owner || (note.mine ? data.profile.name : '笔记发布人'))}</strong></div>
        </div>

function renderNotes(group) {

    ${heading(mine ? '我的笔记' : '联卖房源', mine ? '' : '汇集了homeseek ai用户上传的需要同城联卖的房源。', mine ? link('＋ 添加笔记', 'note-edit/new/my-notes') : '')}

function noteImage(note, index) {
  const photo = note.photos[index];

  return `<div class="photo-stage">

    ${photo.original ? photoVersions(original, 'note-version') : ''}
    <button class="photo-side photo-prev" type="button" aria-label="上一张" data-action="note-photo" data-value="${index - 1}"${index <= 0 ? ' disabled' : ''}>${glyph('left')}</button>

    <div class="photo-tools"><button class="photo-label" type="button" data-action="open-gallery">${glyph('photo')}${index + 1} / ${note.photos.length} 张图片</button>${note.mine ? `<button class="photo-label" type="button" data-action="demo-action" data-value="AI 生成参考">${glyph('sparkles')}AI 生成参考</button>` : ''}</div>

function photoVersions(original, command) {
  return `<div class="photo-versions" role="group" aria-label="图片版本"><button type="button" aria-pressed="${!original}" data-action="${command}" data-value="edited">修图</button><button type="button" aria-pressed="${original}" data-action="${command}" data-value="original">原图</button></div>`;
}

function markdown(text) {
  const inline = value => value.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  const formatted = esc(text).trim().split(/\n{2,}/).filter(Boolean).map(block => {
    if (/^#{1,3} /.test(block)) return `<h3>${block.replace(/^#{1,3} /, '')}</h3>`;
    if (/^&gt; /.test(block)) return `<blockquote>${block.replace(/^&gt; /gm, '').replace(/\n/g, '<br>')}</blockquote>`;
    if (/^[-*] /.test(block)) return `<ul>${block.split('\n').map(line => `<li>${inline(line.replace(/^[-*] /, ''))}</li>`).join('')}</ul>`;
    return `<p>${inline(block).replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return formatted || '<p class="muted">暂无正文</p>';
}

      ${note.mine && note.photos.length ? `<p class="small muted gallery-copy">长按缩略图拖动排序，第一张为封面</p>` : ''}

    </section>

  </div>`;
}

function openGallery(note, index) {
  ui.gallery = { noteId: note.id, index, original: !!ui.originalPhotos[note.id] };

}

function renderGallery() {

  const previous = `<button class="photo-side photo-prev" type="button" aria-label="上一张" data-action="gallery-step" data-value="-1"${gallery.index === 0 ? ' disabled' : ''}>${glyph('left')}</button>`;
  const next = `<button class="photo-side photo-next" type="button" aria-label="下一张" data-action="gallery-step" data-value="1"${gallery.index === note.photos.length - 1 ? ' disabled' : ''}>${glyph('right')}</button>`;

  </div>`, true, '', 'gallery');
}

// 出租按原版分「常规租金」和「春节期间」两组，各四个周期，统一按万元填写。
const RENT_PERIODS = [['1', '一个月', '1.8'], ['3', '三个月', '4.8'], ['6', '半年', '8.4'], ['12', '一年', '14.4']];
const RENT_FIELDS = ['rentType', ...['rent', 'spring'].flatMap(group => RENT_PERIODS.map(([months]) => `${group}${months}`))];
const NOTE_FIELDS = ['estate', 'title', 'owner', 'phone', 'type', 'floor', 'area', 'price', 'unit', 'layout', 'facing', 'commission', 'facilities', 'region', 'body', 'memo', 'visibility', ...RENT_FIELDS];
function prepareDraft(id) {
  if (ui.draft?.editorId === id) return;
  const source = byNote(id);
  const blank = { ...Object.fromEntries(NOTE_FIELDS.map(name => [name, ''])), type: '', unit: '万', rentType: '常规出租', visibility: 'private', mine: true, age: 0, photos: [] };
  ui.draft = { editorId: id, note: structuredClone(source || blank), paste: '', url: '' };
  ui.editorTab = 'paste';
  ui.preview = false;
}

function syncDraft() {
  const form = $('#note-form');
  if (!form || !ui.draft) return;
  const formData = new FormData(form);
  for (const field of NOTE_FIELDS) {
    if (formData.has(field)) ui.draft.note[field] = String(formData.get(field));
  }
  form.querySelectorAll('[data-photo-caption]').forEach(field => {
    ui.draft.note.photos[Number(field.dataset.photoCaption)].caption = field.value;
  });
  if (formData.has('paste')) ui.draft.paste = String(formData.get('paste'));
  if (formData.has('url')) ui.draft.url = String(formData.get('url'));
  $('#save-note').disabled = !ui.draft.note.estate.trim() || !ui.draft.note.title.trim();
}

        <div class="storage-row"><span class="capacity-icon">${glyph('tray')}</span><span><strong>笔记空间</strong><small class="muted">原始附件累计</small></span><strong>252.2 MB / ∞</strong></div>

        <div class="actions"><button class="btn primary" type="submit" id="save-note"${draft.estate.trim() && draft.title.trim() ? '' : ' disabled'}>${create ? '保存笔记' : '保存更改'}</button></div>
      </div>

  </div>`;
}

function importNote(method) {
  syncDraft();
  const draft = ui.draft;
  if (method === 'link') {
    let parsed;
    try { parsed = new URL(draft.url); } catch { notify('请输入完整的网页链接'); return; }
    if (!['https:', 'http:'].includes(parsed.protocol)) { notify('请输入 HTTP 或 HTTPS 链接'); return; }
    showDialog('链接导入预览', `<div class="stack"><p class="notice">离线演示可以记录链接来源。</p><blockquote>${esc(parsed.hostname)}</blockquote>${action('添加到正文', 'save-source')}</div>`);
    return;
  }
  const text = draft.paste.trim();
  if (!text) { notify('先粘贴一段房源文案'); return; }
  const estate = text.match(/楼盘\s*[：:]\s*([^\n，,；;]+)/);
  const area = text.match(/(\d+(?:\.\d+)?)\s*(?:㎡|平米|平方米)/);
  if (estate && !draft.note.estate) draft.note.estate = estate[1].trim().slice(0, 65);
  if (!draft.note.title) draft.note.title = (draft.note.estate || text.split('\n')[0]).slice(0, 80);
  if (area && !draft.note.area) draft.note.area = area[1];
  if (!draft.note.body) draft.note.body = text;
  updateEditor();
  notify('已提取可识别的字段，请核对后保存');
}


function chatStatus(chat) {
  return ({ ready: '已完成', empty: '暂无匹配', processing: '处理中', clarify: '待补充' })[chat.status] || '已完成';
}

function chatReply(chat) {
  if (chat.status === 'processing') return '正在检索相关房源及笔记。';
  if (chat.status === 'empty') return '本轮暂无符合条件的演示房源。可调整预算、户型或楼盘后继续查找。';
  if (chat.status === 'clarify') return '还需要补充条件。你最优先考虑的是楼盘、预算还是户型？';
  if (chat.mode === 'dictionary') return '楼盘字典结果可展示楼盘、面积、户型、交付时间与来源。当前为离线示例。';
  if (chat.mode === 'web') return '联网搜索结果可展示摘要和来源条目。当前为离线示例，购房政策需查阅正式文件。';
  if (chat.mode === 'poster') return '参考图已选定。这里演示任务完成后的结果区、尺寸和返回入口。';
  return '以下为演示匹配结果。点「房源」查看参考报价、面积与发布记录，点「详情」查看筛选依据。';
}

function matchingChats(filter = ui.filters.history) {
  return data.chats.filter(chat => (filter.tracked !== 'yes' || chat.tracked) &&
    (filter.mode === 'all' || chat.mode === filter.mode) &&
    includes(ui.searches.history, chat.question, chat.id, modeLabel(chat.mode)));
}

function historyResults() {
  const chats = matchingChats();
  return `<p class="result-count muted">共 ${chats.length} 条记录</p>
    ${chats.length ? chats.map(chat => `<article class="surface record-card">
      ${ui.manage ? `<input class="select-row" type="checkbox" aria-label="选择${esc(chat.question)}" data-select-chat="${chat.id}"${ui.selectedChats.has(chat.id) ? ' checked' : ''}>` : ''}
      <a class="record-body" href="#chat/${chat.id}/talk/history">
        <span class="small muted">${esc(chat.date)}</span>
        <h3>${esc(chat.question)}</h3><p class="muted">${esc(chat.status === 'ready' ? chatReply(chat) : '这次对话暂未生成可展示的总结。')}</p>
        <div class="pills record-meta"><span class="small muted">${MODES[chat.mode].category} · ${1 + chat.followups.length} 轮</span>${chat.tracked ? chip('追踪中') : ''}</div>
      </a>
      ${ui.manage ? '' : `<button type="button" class="btn quiet icon-button record-more" aria-label="对话操作" data-action="chat-menu" data-value="${chat.id}">${glyph('ellipsis')}</button>`}
    </article>`).join('') : empty('没有符合条件的历史记录', link('去找房', 'find'))}`;
}

// loading 为 true 时与原版首次进入一致：保留搜索栏，记录数为 0，下方显示读取进度。
function renderHistory(loading = false) {
  if (loading) {

    ${searchBar('history', '搜索标题、客户原话或对话 ID', `<button class="btn icon-button" type="button" data-action="history-menu" aria-label="历史管理" disabled>${glyph('ellipsis')}</button>`)}
    <p class="result-count muted">共 0 条记录</p>

    <h1 class="sr-only">历史记录</h1>

    </div>` : ''}

function propertiesFor(chat) {
  if (chat.status !== 'ready' || chat.mode !== 'find') return [];
  return PROPERTIES;
}

function resultStats(chat) {
  const properties = propertiesFor(chat);
  if (chat.id === 'c1') return { homes: 22, contacts: 54 };
  return { homes: properties.length, contacts: properties.reduce((count, property) => count + property.contacts, 0) };
}

const SORT_LABELS = { recommended: '综合排序', price: '总价优先', area: '面积优先', contact: '联系人优先' };
const SORTERS = {
  recommended: (left, right) => right.match - left.match,
  price: (left, right) => left.min - right.min,
  area: (left, right) => right.area - left.area,
  contact: (left, right) => right.contacts - left.contacts,
};

function listingResults(chat, from) {
  const order = ui.filters.listings.sort;
  const filtered = propertiesFor(chat).filter(property =>
    includes(ui.searches.listings, property.estate, property.area, property.layout, property.price, property.facilities, property.contacts))
    .sort(SORTERS[order]);
  return `${order === 'recommended' ? '' : `<p class="result-count muted">${filtered.length} 组房源 · ${SORT_LABELS[order]}</p>`}
    ${filtered.length ? filtered.map((property, index) => `<a class="surface property" href="#listing/${property.id}/${chat.id}/${from}">
      <div class="property-main">
        <div class="row-between"><div class="property-heading"><span class="property-rank">${String(index + 1).padStart(2, '0')}</span><h3>${esc(property.estate)}</h3>${chip('推荐房源', 'solid')}</div><strong class="price">${esc(property.price.replace(/\s万$/, '万'))}</strong></div>
        <p class="muted">${esc(property.estate)} ${property.area}㎡</p>
        <div class="pills">${chip(`匹配 ${property.match}%`, 'outline')}${chip('明确房源', 'outline')}</div>
        <div class="pills">${chip(`${property.area}㎡`, 'neutral')}${chip(property.layout, 'neutral')}</div>
        <p class="small muted property-stats">${property.saleType} ｜ ${property.contacts} 位负责人 ｜ ${property.posts} 次发布 ｜ 最近 ${property.recent}</p>
      </div>
      <span class="property-footer">查看完整房源信息 ${glyph('right')}</span>
    </a>`).join('') : `<p class="muted listings-empty">${propertiesFor(chat).length ? '没有符合搜索条件的房源' : '当前对话还没有房源结果。'}</p>`}`;
}

// 找房回复里的表格：表头固定，内容可左右滑动。
function replyTable(columns, rows) {
  return `<div class="reply-table"><p class="small muted">左右滑动查看完整表格</p><div class="reply-scroll"><table style="min-width: ${columns.length * 92}px">
    <thead><tr>${columns.map(column => `<th scope="col">${column}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></div>`;
}

function rankMark(index) { return `<span class="rank-mark">${index + 1}</span>`; }

function sortedProperties() { return [...PROPERTIES].sort((left, right) => left.min - right.min); }

function priceTable() {
  return `<h4>按价格排序</h4>${replyTable(['#', '面积', '户型', '价格', '负责人'], sortedProperties().map((property, index) =>
    [`${esc(property.estate)} · ${esc(property.layout)} ${rankMark(index)}`, `${property.area}㎡`, esc(property.layout), `<strong>${esc(property.price.replace(/\s万$/, '万'))}</strong>`, `${property.contacts} 位`]))}`;
}

// 对话页的客户回复：重点推荐 + 价格区间总结。联系人与电话在原型里统一隐藏。
function findReply() {
  const ranks = sortedProperties();
  const picks = RESULT_COPY.picks.map(([title, id]) => {
    const property = byProperty(id);
    return `<h4>${title}</h4><blockquote class="reply-pick"><strong>${esc(property.estate)} · ${esc(property.layout)} ${rankMark(ranks.indexOf(property))} · ${property.area}㎡ · ${esc(property.facilities)}</strong>
      <p><strong>${esc(property.price.replace(/\s万$/, '万'))}</strong> · ${property.contacts} 位负责人 · 最近 ${esc(property.recent)}</p>
      <p class="muted">经纪人：示例联系人 · 手机号已隐藏</p></blockquote>`;
  }).join('');
  return `${priceTable()}<h4>重点推荐</h4>${picks}
    <h4>价格区间总结</h4>${replyTable(['面积段', '价格范围', '套数'], RESULT_COPY.priceBands)}
    <p class="reply-warning">部分房源信息发布时间较早，建议优先联系<strong>最近活跃</strong>的经纪人核实房源状态。</p>`;
}

function chatTalk(chat) {
  let response;
  if (chat.status === 'processing') {
    response = `<p class="muted loading" role="status"><span class="spinner" aria-hidden="true"></span>正在检索相关房源及私人笔记</p>`;
  } else {
    response = `<div class="reply surface">
      <div class="reply-head"><h2>${chat.mode === 'find' ? '客户回复' : modeLabel(chat.mode) + '结果'}</h2>${chat.status === 'ready' ? '<small class="muted">已完整保存</small>' : ''}</div>
      <div class="reply-copy">${chat.id === 'c1' ? `${C1_INTRO}<h3>阿罗哈 2 居室在售房源</h3>${findReply()}` : `<p>${esc(chatReply(chat))}</p>`}
      ${chat.mode === 'web' ? '<p class="small muted">来源栏示例 · 住建部门公开信息、政策原文</p>' : ''}
      ${chat.mode === 'poster' ? `<div class="notice">输出比例 9:16 · 原型已走完素材提交和结果提示。</div>` : ''}
      </div>
    </div>`;
  }
  return `<div class="stack">
    ${chat.completedAt ? `<div class="notice history-snapshot">${chip('历史检索结果', 'outline')}<p>这轮结果生成于 ${esc(chat.completedAt)}，用于保留当时的回复与房源依据。</p></div>` : ''}
    <div class="row-between chat-round"><div class="pills"><span class="muted">第 1 轮</span>${chip(modeLabel(chat.mode))}</div><small class="muted">${esc(chat.status === 'processing' ? '处理中' : chat.time || chat.date)}</small></div>
    <div class="bubble">${esc(chat.question)}</div>
    <button class="text-link copy-bubble" type="button" data-action="copy-question" data-value="${chat.id}">${glyph('clipboard')}复制</button>

    ${chat.followups.map(question => `<div class="bubble">${esc(question)}</div><p class="notice">追问已加入本地演示记录。</p>`).join('')}
    ${chat.status === 'processing' ? '' : '<p class="small muted chat-saved">本次对话已保存，可在历史对话中继续查看。</p>'}
    ${chatComposer()}
  </div>`;
}

function chatComposer() {
  return `<form class="surface searchbar chat-composer" id="followup-form">

}

  return `<section class="surface reply client-message">
    <div class="reply-head"><div><h2 class="icon-title">${glyph('clipboard')}可直接发给客户</h2><small class="muted">基于最终建议 · 已完整保存</small></div></div>

      <blockquote class="reply-block reply-risk">${chip('风险提醒', 'outline')}<p>${RESULT_COPY.risk}</p></blockquote>

function chatDetails(chat, from) {
  const { homes, contacts } = resultStats(chat);
  return `<div class="stack">
    <section class="surface details-summary">
      <div class="pad summary-text"><h2 class="icon-title">${glyph('find')}已恢复历史对话 · ${1 + chat.followups.length} 轮消息</h2><p class="muted">本页按 Web 端结构展示本轮检索依据与专业判断。</p></div>

function loadingBlock(title, caption) {
  return `<div class="page-loading" role="status"><span class="spinner" aria-hidden="true"></span><strong>${title}</strong><p class="muted">${caption}</p></div>`;
}

// loading 为 true 时按原版加载态显示：保留返回、分段标签和追问框，内容区显示读取进度。
function renderChat(chat, tab, from, loading = false) {
  if (!chat) return empty('找不到对话', link('查看历史', 'history'));
  const parent = from === 'find' ? 'find' : 'history';
  const selected = ['talk', 'details', 'homes'].includes(tab) ? tab : 'talk';
  const count = resultStats(chat).homes;
  const tabs = [
    ['talk', '对话'], ['details', '详情'], ['homes', count ? `房源 ${count}` : '房源'],
  ];
  const tabLink = tabs.map(([key, label]) => `<a class="tab" href="#chat/${chat.id}/${key}/${parent}"${selected === key ? ' aria-current="page"' : ''}>${label}</a>`).join('');
  const listingsSearch = `<h2 class="muted">匹配房源</h2>${searchBar('listings', '搜索楼盘、户型、面积、价格或负责人')}`;
  const content = loading
    ? selected === 'homes'
      ? `<section class="stack chat-listings">${listingsSearch}${loadingBlock('正在载入匹配房源', '正在恢复本轮推荐顺序、房源信息与销售关系。')}</section>`
      : `${loadingBlock('正在读取历史对话', '正在恢复原始问答、检索快照与完整房源资料。')}${selected === 'talk' ? chatComposer() : ''}`
    : selected === 'homes' ? `<section class="stack chat-listings">${listingsSearch}<div id="results" class="stack">${listingResults(chat, parent)}</div></section>` :
    selected === 'details' ? chatDetails(chat, parent) : chatTalk(chat);
  const lead = selected === 'homes'
    ? (loading ? '' : `<blockquote class="demand-block"><span class="small muted">本轮找房需求</span><p>${esc(chat.question)}</p></blockquote>`)
    : loading
      ? heading('房源解读', `${1 + chat.followups.length} 轮对话 · ${modeLabel(chat.mode)}`, '', true)

function pricePoints(property) {
  const values = property.prices.map(([, value]) => value);
  const minimum = Math.min(...values);
  const range = Math.max(1, Math.max(...values) - minimum);
  return values.map((value, index) => [
    5 + (index / Math.max(1, values.length - 1)) * 90,
    12 + (value - minimum) / range * 75,
  ]);
}

    <div class="chart">

      ${property.prices.map(([date, , price], index) => `<button class="chart-dot" type="button" data-action="chart-point" data-value="${index}" style="left:${points[index][0]}%;bottom:${points[index][1]}%" aria-pressed="false" aria-label="${esc(date)} 报价 ${esc(price)}"></button>`).join('')}
    </div>

  </section>`;

function drawChart(property) {
  const canvas = $('#price-chart');
  if (!canvas || !property) return;
  const { width, height } = canvas.getBoundingClientRect();
  const scale = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = width * scale;
  canvas.height = height * scale;
  const context = canvas.getContext('2d');
  context.scale(scale, scale);
  context.strokeStyle = '#dce4d8';
  context.lineWidth = 1;
  for (const fraction of [.2, .4, .6, .8]) {
    context.beginPath();
    context.moveTo(0, height * fraction);
    context.lineTo(width, height * fraction);
    context.stroke();
  }
  context.beginPath();
  context.strokeStyle = '#265a45';
  context.lineWidth = 2;
  pricePoints(property).forEach(([x, y], index) => {
    if (index === 0) context.moveTo(width * x / 100, height * (1 - y / 100));
    else context.lineTo(width * x / 100, height * (1 - y / 100));
  });
  context.stroke();
}

function pendingBindings() {
  const pending = BIND_LISTINGS.filter(item => !data.bound.includes(item.id));
  ui.bindSelected ??= new Set(pending.map(item => item.id));
  for (const id of ui.bindSelected) if (!pending.some(item => item.id === id)) ui.bindSelected.delete(id);
  const pages = Math.max(1, Math.ceil(pending.length / BIND_PAGE_SIZE));

let previousRoute = [];
let loadTimer;
function onNavigate() {
  if (dialog.open) dialog.close();
  const [path, id] = route();
  if (path !== 'note-edit' || previousRoute[1] !== id) ui.draft = null;
  if (path !== 'profile') ui.avatarDraft = null;
  if (path !== 'history') {
    ui.manage = false;
    ui.selectedChats.clear();
  }

  const resource = path === 'listing' ? byProperty(id) : path === 'chat' ? byChat(id) : null;
  const newResource = resource && (previousRoute[0] !== path || previousRoute[1] !== id);
  // 原版切到「房源」标签时会先显示「正在载入匹配房源」。
  const opensListings = path === 'chat' && resource && route()[2] === 'homes' && previousRoute[2] !== 'homes';
  // 「我的」和「历史记录」在原版首次打开时也会先读取一次，之后回来直接显示。
  const firstVisit = ['account', 'history'].includes(path) && !ui.visited.has(path);
  ui.visited.add(path);
  const loads = newResource || opensListings || firstVisit;
  clearTimeout(loadTimer);
  ui.loading = loads ? route().join('/') : '';
  previousRoute = route();
  render();
  window.scrollTo(0, 0);
  page.focus({ preventScroll: true });
  if (loads) {
    loadTimer = setTimeout(() => {
      ui.loading = '';
      render();
    }, 240);
  }
}

let photoPress;
function finishPhotoPress(event, cancelled = false) {
  if (!photoPress || event.pointerId !== photoPress.pointer) return;
  const press = photoPress;
  photoPress = null;
  document.querySelectorAll('.thumb.drag-over').forEach(thumb => thumb.classList.remove('drag-over'));
  if (cancelled || !press.target || performance.now() - press.start < 350) return;
  const index = Number(press.target.dataset.value);
  if (index === press.index) return;
  event.preventDefault();
  const [photo] = press.note.photos.splice(press.index, 1);
  press.note.photos.splice(index, 0, photo);
  ui.photo[press.note.id] = index;
  saveNotice('图片排序已保存');
  render();
}

document.addEventListener('pointerdown', event => {
  const thumb = event.target.closest('.thumb');
  const note = route()[0] === 'note' && byNote(route()[1]);
  if (!thumb || !note?.mine || event.button !== 0) return;
  photoPress = { note, pointer: event.pointerId, index: Number(thumb.dataset.value), start: performance.now(), x: event.clientX, y: event.clientY };
});

document.addEventListener('pointermove', event => {
  if (!photoPress || event.pointerId !== photoPress.pointer) return;
  if (performance.now() - photoPress.start < 350) {
    if (Math.hypot(event.clientX - photoPress.x, event.clientY - photoPress.y) > 9) photoPress = null;
    return;
  }
  const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.thumb');
  if (target === photoPress.target) return;
  photoPress.target?.classList.remove('drag-over');
  photoPress.target = target;
  target?.classList.add('drag-over');
});

document.addEventListener('pointerup', event => finishPhotoPress(event));
document.addEventListener('pointercancel', event => finishPhotoPress(event, true));

async function loadPicture(file, maximumSize) {
  if (!file.type.startsWith('image/') || file.size > 20 * 1024 * 1024) throw new Error('图片格式或大小不支持');
  const bitmap = await createImageBitmap(file);
  try {
    const factor = Math.min(1, maximumSize / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * factor));
    canvas.height = Math.max(1, Math.round(bitmap.height * factor));
    const context = canvas.getContext('2d');
    context.fillStyle = '#ffffff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', .81);
  } finally {
    bitmap.close();
  }
}

document.addEventListener('click', event => {

  if (modeMenu && !modeMenu.contains(event.target)) modeMenu.open = false;
  const anchor = event.target.closest('a[href^="#"]');
  if (anchor && !event.defaultPrevented && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey) {
    event.preventDefault();
    go(anchor.getAttribute('href').slice(1));
    return;
  }
  const control = event.target.closest('[data-action]');
  if (!control || control.disabled) return;
  ACTIONS[control.dataset.action]?.(control.dataset.value || '', control);
});

document.addEventListener('keydown', event => {
  const modeMenu = $('#mode-menu[open]');
  if (event.key !== 'Escape' || !modeMenu) return;
  modeMenu.open = false;
  $('summary', modeMenu).focus();
});

document.addEventListener('input', event => {
  const field = event.target;
  if (field.dataset.search) {
    ui.searches[field.dataset.search] = field.value;
    refreshResults(field.dataset.search);
  }
  if (field.id === 'find-query') ui.query = field.value;
  if (field.name === 'code' && field.closest('#redeem-form')) {
    $('#redeem-form button[type="submit"]').disabled = !field.value.trim();
  }
  if (field.closest('#note-form')) syncDraft();
});

document.addEventListener('change', async event => {
  const field = event.target;
  const filter = field.closest('#filter-form');
  if (filter) {
    const group = filter.dataset.group;
    const values = Object.fromEntries(new FormData(filter));
    const count = filteredCount(group, values);
    $('button[type="submit"]', filter).textContent = `查看 ${count} ${group === 'listings' ? '组' : '条'}`;
    $('[data-action="reset-filters"]', filter).disabled = filterIsDefault(group, values);
  }
  if (field.name === 'type' && field.closest('#note-form')) {
    syncDraft();
    updateEditor();
  }
  if (field.dataset.bindId) {
    if (field.checked) ui.bindSelected.add(field.dataset.bindId);
    else ui.bindSelected.delete(field.dataset.bindId);
    refreshBind();
  }
  if (field.dataset.selectChat) {
    const id = field.dataset.selectChat;
    if (field.checked) ui.selectedChats.add(id);
    else ui.selectedChats.delete(id);
    $('#selected-count').textContent = `已选 ${ui.selectedChats.size} 条`;
  }
  if (field.dataset.findFile) {
    const slot = field.dataset.findFile;
    ui.findFiles[slot] = field.files[0];
    $(`[data-file-name="${slot}"]`).textContent = field.files[0]?.name || '必填';
  }
  if (field.id === 'note-upload' && ui.draft) {
    syncDraft();
    const draft = ui.draft;
    const capacity = Math.max(0, 8 - draft.note.photos.length);
    const files = Array.from(field.files).slice(0, capacity);
    if (!files.length) { notify('已达到 8 张图片上限'); return; }
    const result = await Promise.allSettled(files.map(async file => ({ source: await loadPicture(file, 960), caption: file.name.replace(/\.[^.]+$/, '').slice(0, 30) })));
    if (ui.draft !== draft) return;
    syncDraft();
    const photos = result.flatMap(item => item.status === 'fulfilled' ? [item.value] : []);
    draft.note.photos.push(...photos.slice(0, Math.max(0, 8 - draft.note.photos.length)));
    updateEditor();
    notify(photos.length ? `已选择 ${photos.length} 张图片，保存后生效` : '图片未能读取，请选择 JPG 或 PNG 文件');
  }
  if (field.id === 'avatar-upload' && field.files[0]) {
    if (field.files[0].size > 8 * 1024 * 1024) { notify('请选 8 MB 以内的图片'); return; }
    try {
      const imageData = await loadPicture(field.files[0], 360);
      if (route()[0] !== 'profile') return;
      ui.avatarDraft = imageData;
      $('#avatar-preview').innerHTML = avatarMarkup(imageData, data.profile.name);
    } catch { notify('图片未能读取，请选择 JPG 或 PNG 文件'); }
  }
});

document.addEventListener('submit', event => {
  const form = event.target;
  event.preventDefault();
  const fields = new FormData(form);
  switch (form.id) {
    case 'find-form': {
      const question = String(fields.get('question') || '').trim();
      if (ui.mode === 'poster') {
        if (!ui.findFiles.poster || !ui.findFiles.person) { notify('请先选好海报和人物两张参考图'); return; }
        newChat(question || '海报复刻 · 9:16', 'poster');
      } else if (question) newChat(question, ui.mode);
      else notify('请输入找房诉求');
      break;
    }
    case 'filter-form': {
      const group = form.dataset.group;
      ui.filters[group] = Object.fromEntries(fields);
      dialog.close();
      refreshResults(group);
      break;
    }
    case 'note-form': {
      syncDraft();
      const { editorId, note } = ui.draft;
      note.estate = note.estate.trim();
      note.title = note.title.trim();
      if (!note.estate || !note.title) return;
      if (editorId === 'new') data.notes.unshift({ ...note, id: newId(), date: dateISO() });
      else {
        const index = data.notes.findIndex(item => item.id === editorId);
        if (index < 0) return;
        data.notes[index] = note;
      }
      ui.draft = null;
      saveNotice(editorId === 'new' ? '笔记已添加到本地' : '笔记更改已保存');
      const parent = route()[2] === 'my-notes' || note.visibility === 'private' ? 'my-notes' : 'notes';
      go(editorId === 'new' ? 'my-notes' : `note/${editorId}/${parent}`);
      break;
    }
    case 'followup-form': {
      const question = String(fields.get('question') || '').trim();
      if (!question) return;
      const chat = byChat(route()[1]);
      chat.followups.push(question);
      saveNotice('追问已添加到本地对话');
      render();
      $('#followup-form input').focus();
      break;
    }
    case 'profile-form': {
      const name = String(fields.get('name') || '').trim();
      if (!name) { notify('请输入昵称'); return; }
      data.profile = { ...data.profile, name, smart: fields.has('smart'), avatar: ui.avatarDraft || '' };
      saveNotice('资料已保存在原型中');
      go('account');
      break;
    }
    case 'redeem-form': {
      if (String(fields.get('code')).trim().toUpperCase() !== 'DEMO-2026') { notify('这个原型使用演示码 DEMO-2026'); return; }
      if (data.redeemed) { notify('演示码已经兑换过'); return; }
      data.redeemed = true;
      data.points += 30;
      saveNotice('演示兑换完成，已增加 30 积分');
      render();
      break;
    }
  }
});

dialog.addEventListener('keydown', event => {
  if (!$('#dialog img.dialog-photo')) return;
  if (event.key === 'ArrowLeft') ACTIONS['gallery-step']('-1');
  if (event.key === 'ArrowRight') ACTIONS['gallery-step']('1');
});

window.addEventListener('resize', () => {
  if (route()[0] === 'listing') drawChart(byProperty(route()[1]));
});
window.addEventListener('hashchange', () => {
  currentPath = location.hash.slice(1);
  onNavigate();
});
onNavigate();


</script>
</body>
</html>
